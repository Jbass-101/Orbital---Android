[versions]
agp = "8.13.2"
kotlin = "2.3.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.2"
composeBom = "2026.01.00"
ktorBom = "3.4.0"
kotlinxCoroutines = "1.10.2"
kotlin-ksp ="2.3.3"
hilt-dagger = "2.58"
kotlin-serialization = "2.3.0"
json-serialization = "1.10.0"
hilt-navigation-compose = "1.2.0"
navigation-compose = "2.9.7"
mock-test="1.14.9"
turbine="1.2.1"
truth="1.4.5"
kotlin-faker="1.16.0"
logback-classic="1.5.27"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-icons = {group = "androidx.compose.material", name = "material-icons-core"}
androidx-compose-icons-extended = {group = "androidx.compose.material", name = "material-icons-extended"}
androidx-navigation-compose = {group ="androidx.navigation", name = "navigation-compose", version.ref="navigation-compose"}
mock-test = {group ="io.mockk", name="mockk", version.ref="mock-test"}
turbine-test = {group ="app.cash.turbine", name="turbine", version.ref="turbine"}
google-truth = {group ="com.google.truth", name="truth", version.ref="truth"}
kotlin-faker = {group ="io.github.serpro69", name="kotlin-faker", version.ref="kotlin-faker"}
logback-classic = {group = "ch.qos.logback", name="logback-classic" ,version.ref="logback-classic"}



##Ktor
ktor-bom = {group ="io.ktor", name = "ktor-bom", version.ref="ktorBom"}
ktor-client-core = {group ="io.ktor", name = "ktor-client-core"}
ktor-client-okhttp = {group ="io.ktor", name = "ktor-client-okhttp"}
ktor-client-websockets = {group ="io.ktor", name = "ktor-client-websockets"}
ktor-client-content-negotiation = {group ="io.ktor", name = "ktor-client-content-negotiation"}
ktor-serialization= {group ="io.ktor", name = "ktor-serialization-kotlinx-json"}
ktor-server-test= {group ="io.ktor", name = "ktor-server-test-host"}
ktor-server-websockets= {group ="io.ktor", name = "ktor-server-websockets"}
ktor-server-content-negotiation = {group ="io.ktor", name = "ktor-server-content-negotiation"}




#Coroutine
kotlinx-coroutines= {group ="org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines"}
kotlinx-coroutines-test= {group ="org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines"}

#Hilt-Dagger
hilt-android = {group ="com.google.dagger", name = "hilt-android", version.ref = "hilt-dagger"}
hilt-compiler = {group ="com.google.dagger", name = "hilt-compiler", version.ref = "hilt-dagger"}
hilt-android-testing = {group ="com.google.dagger", name = "hilt-android-testing", version.ref = "hilt-dagger"}

#Hilt-Navigation-Compose : Viewmodels
navigation-compose = {group = "androidx.hilt", name="hilt-navigation-compose", version.ref ="hilt-navigation-compose" }

#Json Serialization
json-serialization = {group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref="json-serialization"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
#Kotlin-Ksp
kotlin-ksp = {id = "com.google.devtools.ksp", version.ref="kotlin-ksp"}
#Kotlin-Serialization
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-serialization"}
#Dagger-Hilt
dagger-hilt = {id ="com.google.dagger.hilt.android", version.ref ="hilt-dagger"}
